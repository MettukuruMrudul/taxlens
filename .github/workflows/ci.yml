# Runs on every push and pull request:
#   backend  - ruff lint + pytest with coverage
#   frontend - ESLint + TypeScript type-check + production build
# Runs weekly and on demand (Actions tab -> CI -> Run workflow):
#   evaluation - fetch the IRS corpus, build the index, run both benchmarks,
#                and fail if the answer-quality gate fails
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check taxlens tests
      - name: Tests
        run: python -m pytest --cov=taxlens --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  evaluation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: taxlens
          POSTGRES_PASSWORD: taxlens
          POSTGRES_DB: taxlens
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U taxlens -d taxlens"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://taxlens:taxlens@localhost:5433/taxlens
      REDIS_URL: redis://localhost:6379/0
      USER_AGENT: "TaxLens CI (github.com/${{ github.repository }})"
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create base schema
        run: PGPASSWORD=taxlens psql -h localhost -p 5433 -U taxlens -d taxlens -f db/init/001_schema.sql
      - name: Fetch IRS corpus
        run: python -m taxlens.ingest.fetch
      - run: python -m taxlens.migrate
      - run: python -m taxlens.ingest.run_parser
      - run: python -m taxlens.index.build
      - name: Retrieval benchmark
        run: python -m taxlens.eval.run_retrieval
      - name: Answer benchmark + quality gate
        run: python -m taxlens.eval.run_answers --no-models --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/

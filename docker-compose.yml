# Local infrastructure for TaxLens.
#   db       = PostgreSQL 16 with pgvector (documents, lines, index units, embeddings, logs)
#   redis    = answer cache + rate-limit counters
#   api      = FastAPI backend          (profile "app")
#   frontend = Next.js web app           (profile "app")
#
# Development (run Python and Next.js yourself):   docker compose up -d
# Everything in containers:                         docker compose --profile app up -d --build
#
# Postgres is exposed on port 5433 (not the usual 5432) so it won't clash
# with any Postgres you may already have installed.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: taxlens-db
    environment:
      POSTGRES_USER: taxlens
      POSTGRES_PASSWORD: taxlens
      POSTGRES_DB: taxlens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL files in db/init run automatically the FIRST time the database starts.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxlens -d taxlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: taxlens-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    container_name: taxlens-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://taxlens:taxlens@db:5432/taxlens
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE: redis://redis:6379/1
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw:/app/data/raw:ro      # IRS PDFs, for page images
      - ./models:/app/models:ro          # trained intent / abstention models, if any
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: taxlens-frontend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
